- hosts: prod_clusters
  gather_facts: false
  tasks:
    - name: Create argocd namespace
      kubernetes.core.k8s:
        context: "{{ k8s_context }}"
        name: argocd
        api_version: v1
        kind: Namespace
        state: present

    - name: Deploy Argo CD via server-side apply
      kubernetes.core.k8s:
        context: "{{ k8s_context }}"
        namespace: argocd
        src: https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        state: present
        apply: true
        server_side_apply:
          field_manager: ansible
          force_conflicts: true
