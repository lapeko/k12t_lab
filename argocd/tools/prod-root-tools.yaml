apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-root-tools
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/lapeko/k12t_lab.git
    targetRevision: HEAD
    path: argocd/tools/prod
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
