name: Dev Deploy

on:
  workflow_dispatch:
    inputs:
      app:
        description: "Choose APP to deploy on dev environment"
        required: true
        type: choice
        options:
          # - nginx
          - subscriptions

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Docker pull
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Envs
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          APP=${{ github.event.inputs.app }}
          echo "SHORT_SHA=${SHORT_SHA}" >> $GITHUB_ENV
          echo "APP=${APP}" >> $GITHUB_ENV
          echo "NEW_IMAGE=${{ vars.DOCKERHUB_USERNAME }}/${APP}:sha-${SHORT_SHA}" >> $GITHUB_ENV

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: apps/${{ github.event.inputs.app }}
          file: apps/${{ github.event.inputs.app }}/Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/${{ github.event.inputs.app }}:sha-${{ env.SHORT_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v3

      - name: Update Manifest and Commit
        run: |
          cd apps/${{ env.APP }}/k8s/overlays/dev
          kustomize edit set image ${{ vars.DOCKERHUB_USERNAME }}/${{ env.APP }}=${{ env.NEW_IMAGE }}

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add kustomization.yaml
          git commit -m "chore(dev): update ${{ env.APP }} image to sha-${{ env.SHORT_SHA }} [skip ci]"
          git push
