apiVersion: batch/v1
kind: Job
metadata:
  name: migrator
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrator
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: stage-db-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: stage-db-secret
                  key: password
            - name: DATABASE_URL
              value: "postgres://$(DB_USER):$(DB_PASSWORD)@stage-postgres:5432/subscriptions?sslmode=disable"
